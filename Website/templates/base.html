<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title or "Sistem Analisis Sentimen" }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<!-- Left Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo-section">
      <i class="fas fa-brain text-white"></i>
      <span class="ms-2 text-white fw-bold">SentiMeter</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
      <i class="fas fa-home"></i>
      <span>Dashboard</span>
    </a>
    
    <div class="nav-section-title">Pipeline</div>
    <a href="/upload" class="nav-link {% if request.path == '/upload' %}active{% endif %}">
      <i class="fas fa-file-upload"></i>
      <span>Upload Data</span>
    </a>
    <a href="/fitur" class="nav-link {% if request.path == '/fitur' %}active{% endif %}">
      <i class="fas fa-sliders-h"></i>
      <span>Ekstraksi Fitur</span>
    </a>
    <a href="/klasifikasi" class="nav-link {% if request.path == '/klasifikasi' %}active{% endif %}">
      <i class="fas fa-cube"></i>
      <span>Klasifikasi</span>
    </a>

    <div class="nav-section-title">Hasil & Analisis</div>
    <a href="/preprocessing" class="nav-link {% if request.path == '/preprocessing' %}active{% endif %}">
      <i class="fas fa-cog"></i>
      <span>Preprocessing</span>
    </a>
    <a href="/perbandingan" class="nav-link {% if request.path == '/perbandingan' %}active{% endif %}">
      <i class="fas fa-exchange-alt"></i>
      <span>Perbandingan</span>
    </a>
    <a href="/evaluasi" class="nav-link {% if request.path == '/evaluasi' %}active{% endif %}">
      <i class="fas fa-chart-bar"></i>
      <span>Evaluasi</span>
    </a>
    <a href="/hasil" class="nav-link {% if request.path == '/hasil' %}active{% endif %}">
      <i class="fas fa-check-circle"></i>
      <span>Hasil</span>
    </a>

    <div class="nav-section-title">Riwayat</div>
    <a href="/riwayat" class="nav-link {% if request.path == '/riwayat' %}active{% endif %}">
      <i class="fas fa-history"></i>
      <span>Semua Model</span>
    </a>

    <div class="nav-section-title">Prediksi</div>
    <a href="/prediksi-detail" class="nav-link {% if request.path == '/prediksi-detail' %}active{% endif %}">
      <i class="fas fa-brain"></i>
      <span>Detail Prediksi</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="/logout" class="nav-link text-danger">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </a>
  </div>
</div>

<!-- Main Content -->
<div class="main-content">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-welcome">
      <h5 class="mb-0">Selamat Datang di Sistem Analisis Sentimen</h5>
      <small class="text-muted">Harap diisi data dengan benar</small>
    </div>
    <div class="topbar-right">
      <button class="btn btn-sm btn-outline-secondary" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </div>

  <!-- Page Content -->
  <div class="page-content">
    {% block content %}{% endblock %}
  </div>
</div>

<script>
function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('collapsed');
  document.querySelector('.main-content').classList.toggle('expanded');
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
