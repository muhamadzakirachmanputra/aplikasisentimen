<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Negative (Red/Pink) -->
    <linearGradient id="negGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="100%" stop-color="#f4104d"/>
    </linearGradient>
    <!-- Positive (Green/Teal) -->
    <linearGradient id="posGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Bubble (Negative) -->
  <g transform="translate(6, 6) scale(2.6)" filter="url(#shadow)">
    <!-- Original 24x24 bubble path -->
    <path fill="url(#negGrad)" d="M12 2C6.48 2 2 6.48 2 12c0 2.76 1.12 5.26 2.93 7.07L3 22l2.93-1.93c1.81.93 3.86 1.43 6.07 1.43 5.52 0 10-4.48 10-10S17.52 2 12 2z"/>
    <!-- Sad Face -->
    <circle cx="8" cy="10" r="1.5" fill="#fff"/>
    <circle cx="16" cy="10" r="1.5" fill="#fff"/>
    <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" d="M8 15 Q12 11 16 15"/>
  </g>

  <!-- Right Bubble (Positive) -->
  <g transform="translate(30, 24) scale(2.6)" filter="url(#shadow)">
    <!-- Mirrored path for right tail -->
    <path fill="url(#posGrad)" d="M12 2 C17.52 2 22 6.48 22 12 c0 2.76 -1.12 5.26 -2.93 7.07 L21 22 l-2.93 -1.93 c-1.81 .93 -3.86 1.43 -6.07 1.43 C6.48 21.57 2 17.09 2 12 S6.48 2 12 2 z"/>
    <!-- Smile Face -->
    <circle cx="8" cy="10" r="1.5" fill="#fff"/>
    <circle cx="16" cy="10" r="1.5" fill="#fff"/>
    <path fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" d="M8 13 Q12 17 16 13"/>
  </g>


</svg>
